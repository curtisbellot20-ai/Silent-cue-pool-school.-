<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pool Lesson Simulator — Silent Cue</title>
  <meta name="description" content="Interactive pool lesson simulator. The Golden Zone gives you 3+ easy shots. The Dead Zone leaves you with banks, kicks, and hard cuts. Learn to plan every shot to land in the Golden Zone." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & Base ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #080808;
      --felt:      #0D2B1F;
      --rail:      #1B4332;
      --cushion:   #2D6A4F;
      --gold:      #C9A84C;
      --gold-dim:  rgba(201,168,76,0.15);
      --gold-mid:  rgba(201,168,76,0.4);
      --ivory:     #E8E0D0;
      --smoke:     #5A5A5A;
      --panel-bg:  #0F0F0F;
      --panel-border: rgba(201,168,76,0.15);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ivory);
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    /* ── Top Bar ─────────────────────────────────────────────────────── */
    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      padding: 0 24px;
      background: #0a0a0a;
      border-bottom: 1px solid var(--panel-border);
      flex-shrink: 0;
      z-index: 10;
    }

    #topbar .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--ivory);
    }
    #topbar .logo-dot { color: var(--gold); font-size: 10px; }
    #topbar .logo-text {
      font-family: Georgia, serif;
      font-size: 15px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ivory);
    }

    #topbar .lesson-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 16px;
      color: var(--gold);
      letter-spacing: 0.06em;
    }

    #topbar .exit-link {
      font-size: 12px;
      color: var(--smoke);
      text-decoration: none;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: color 0.2s;
    }
    #topbar .exit-link:hover { color: var(--gold); }

    /* ── Main Layout ──────────────────────────────────────────────────── */
    #app {
      display: flex;
      height: calc(100vh - 52px);
      overflow: hidden;
    }

    /* ── Left Panel ───────────────────────────────────────────────────── */
    #panel {
      width: 300px;
      flex-shrink: 0;
      background: var(--panel-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Lesson selector tabs */
    #lesson-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid var(--panel-border);
    }
    .lesson-tab {
      background: none;
      border: none;
      border-right: 1px solid var(--panel-border);
      color: var(--smoke);
      font-family: Inter, system-ui, sans-serif;
      font-size: 11px;
      letter-spacing: 0.06em;
      padding: 12px 4px;
      cursor: pointer;
      transition: color 0.2s, background 0.2s;
      text-align: center;
    }
    .lesson-tab:last-child { border-right: none; }
    .lesson-tab:hover { color: var(--ivory); background: rgba(255,255,255,0.03); }
    .lesson-tab.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

    /* Lesson content */
    #lesson-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    #lesson-content::-webkit-scrollbar { width: 4px; }
    #lesson-content::-webkit-scrollbar-track { background: transparent; }
    #lesson-content::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 2px; }

    #lesson-number {
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }
    #lesson-name {
      font-family: Georgia, serif;
      font-size: 20px;
      color: var(--ivory);
      line-height: 1.3;
      margin-top: 6px;
    }
    #lesson-desc {
      font-size: 13px;
      color: var(--smoke);
      line-height: 1.7;
      border-left: 2px solid var(--panel-border);
      padding-left: 12px;
    }

    .divider {
      height: 1px;
      background: var(--panel-border);
    }

    #step-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--smoke);
    }
    #step-counter {
      font-size: 11px;
      color: var(--gold);
      margin-top: 2px;
    }
    #step-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 17px;
      line-height: 1.6;
      color: var(--ivory);
      margin-top: 10px;
      min-height: 80px;
    }

    /* Power bar */
    #power-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    #power-label {
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--smoke);
      display: flex;
      justify-content: space-between;
    }
    #power-track {
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 2px;
      overflow: hidden;
    }
    #power-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--gold) 0%, #f0c060 100%);
      border-radius: 2px;
      transition: width 0.04s linear;
    }

    /* Controls */
    #controls {
      display: flex;
      gap: 8px;
      padding: 16px 20px;
      border-top: 1px solid var(--panel-border);
      flex-shrink: 0;
    }
    .btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid var(--panel-border);
      background: none;
      color: var(--ivory);
      font-family: Inter, system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 2px;
    }
    .btn:hover { border-color: var(--gold); color: var(--gold); }
    .btn.btn--primary {
      background: var(--gold);
      border-color: var(--gold);
      color: #080808;
      font-weight: 500;
    }
    .btn.btn--primary:hover { background: #d4b060; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn:disabled:hover { border-color: var(--panel-border); color: var(--ivory); }

    /* ── Canvas Area ──────────────────────────────────────────────────── */
    #canvas-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* Ambient vignette */
    #canvas-area::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
      pointer-events: none;
      z-index: 2;
    }

    #pool-canvas {
      display: block;
      border-radius: 4px;
      cursor: crosshair;
      position: relative;
      z-index: 1;
    }

    /* Feedback overlay (canvas-relative, absolutely positioned over canvas) */
    #feedback-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 22px;
      color: var(--gold);
      text-align: center;
      background: rgba(8,8,8,0.82);
      border: 1px solid var(--gold-mid);
      padding: 16px 32px;
      border-radius: 2px;
      letter-spacing: 0.05em;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
      white-space: nowrap;
    }
    #feedback-msg.show { opacity: 1; }

    /* Hint bar at bottom of canvas area */
    #hint-bar {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 11px;
      color: var(--smoke);
      letter-spacing: 0.08em;
      pointer-events: none;
      z-index: 3;
    }
  </style>
</head>
<body>

<!-- Top Bar -->
<div id="topbar">
  <a href="../index.html" class="logo">
    <span class="logo-dot">&#9679;</span>
    <span class="logo-text">Silent Cue</span>
  </a>
  <span class="lesson-title" id="topbar-title">Pool Lesson Simulator</span>
  <a href="../index.html#archive" class="exit-link">&#8592; Archive</a>
</div>

<!-- App -->
<div id="app">

  <!-- Left Panel -->
  <div id="panel">
    <div id="lesson-tabs">
      <button class="lesson-tab active" data-lesson="0">L1</button>
      <button class="lesson-tab" data-lesson="1">L2</button>
      <button class="lesson-tab" data-lesson="2">L3</button>
      <button class="lesson-tab" data-lesson="3">L4</button>
    </div>

    <div id="lesson-content">
      <div>
        <div id="lesson-number">Lesson 01</div>
        <div id="lesson-name">The Golden Zone</div>
      </div>
      <div id="lesson-desc"></div>
      <div class="divider"></div>
      <div>
        <div id="step-label">Current Instruction</div>
        <div id="step-counter">Step 1 of 4</div>
        <div id="step-text"></div>
      </div>
      <div class="divider"></div>
      <div id="power-section">
        <div id="power-label">
          <span>Shot Power</span>
          <span id="power-pct">0%</span>
        </div>
        <div id="power-track"><div id="power-fill"></div></div>
      </div>
    </div>

    <div id="controls">
      <button class="btn" id="btn-reset">Reset</button>
      <button class="btn btn--primary" id="btn-next">Next Step</button>
    </div>
  </div>

  <!-- Canvas Area -->
  <div id="canvas-area">
    <canvas id="pool-canvas"></canvas>
    <div id="feedback-msg"></div>
    <div id="hint-bar">Click and drag from the cue ball to aim — release to shoot</div>
  </div>

</div>

<script>
// ============================================================
//  Silent Cue — Pool Lesson Simulator
// ============================================================

(function () {
'use strict';

// ── Lesson Data ──────────────────────────────────────────────
const LESSONS = [
  {
    number: 'Lesson 01',
    name: 'The Golden Zone',
    desc: 'The Golden Zone is an area on the table where, when the white ball lands there, you will have three or more semi-easy or very easy shots available. That is your target after every single shot.',
    steps: [
      'Study the table. The cue ball is near the rail — the Dead Zone. In the Dead Zone you may have zero shots, one shot, or only brutal options: banks, kicks, jump shots, hard cuts, masse shots. Nothing straight in.',
      'Click the cue ball and drag to aim at the yellow ball.',
      'The Golden Zone is highlighted. When you land here, three or more easy or semi-easy shots will be available to you. That is the goal — not just sinking this ball, but earning your next three.',
      'Shoot. After the shot, count your options. Three or more easy shots means you found the Golden Zone. Always plan your next shot to land there.'
    ],
    showGoldenZone: true,
    showDeadZone: true,
    showGhost: true,
  },
  {
    number: 'Lesson 02',
    name: 'The Dead Zone',
    desc: 'The Dead Zone gives you one shot, no shots, or only extremely hard options — banks, kicks, jump shots, hard cuts, masse shots, nothing straight in. Avoid it at all costs. Every shot you take should be planned to keep the white ball out of these areas.',
    steps: [
      'Two paths are highlighted. The red path sinks the ball — but drops the white near the rail. From there: one option, maybe none, or a brutal bank. That is the Dead Zone.',
      'The gold path also sinks the ball, but routes the white to the Golden Zone. From there: three or more easy shots are waiting.',
      'The Dead Zone is not just near the rails. Any spot that leaves you with banks, kicks, jump shots, hard cuts, or masse shots is a Dead Zone. Straight-in shots disappear. You are fighting the table.',
      'Position play is decided before the shot. Click the gold path to execute the smart shot — the one that earns you the next three.'
    ],
    showGoldenZone: true,
    showDeadZone: true,
    showGhost: true,
    showTwoPaths: true,
  },
  {
    number: 'Lesson 03',
    name: 'Reading the Table',
    desc: 'Before you touch the cue, read the table. Find the Golden Zones — areas that give you three or more easy shots. Find the Dead Zones — areas that trap you. Then plan your run so the white ball moves from Golden Zone to Golden Zone.',
    steps: [
      'Before touching the cue, read the table. Do not look at the easiest shot first — look for your path through the entire rack.',
      'Click any ball to analyze its position. Is sinking it likely to land the white in a Golden Zone (3+ easy shots) or a Dead Zone (banks, kicks, hard cuts, nothing straight)?',
      'Notice which balls are in open areas and which are clustered near rails or other balls. Clustered near rails usually means Dead Zone risk.',
      'Build your run sequence so the white ball travels from Golden Zone to Golden Zone. Each shot earns you the next three — that is control.'
    ],
    showGoldenZone: false,
    showDeadZone: false,
    showGhost: false,
    readMode: true,
  },
  {
    number: 'Lesson 04',
    name: 'The Ghost Drill',
    desc: 'Aiming is only half the shot. The other half is where the white ball goes after contact. Use the ghost ball method to aim the shot — then ask yourself: where does the white land? Golden Zone or Dead Zone?',
    steps: [
      'Click the target ball to reveal the ghost ball position. The ghost ball is an imaginary cue ball sitting exactly where contact must happen to sink the shot.',
      'Aim the center of your cue ball at the center of the ghost ball. That is the ghost ball method — the most reliable aiming system in pool.',
      'Now look at the cue ball\'s path after contact. Where will the white ball travel? Is that a Golden Zone — three or more easy shots — or a Dead Zone?',
      'Shoot. After the shot, evaluate: did you sink the ball AND land in position? Both matter. One without the other is incomplete pool.'
    ],
    showGoldenZone: false,
    showDeadZone: false,
    showGhost: true,
    ghostDrill: true,
  }
];

// ── Canvas Setup ──────────────────────────────────────────────
const canvas = document.getElementById('pool-canvas');
const ctx    = canvas.getContext('2d');

// Table dimensions
const TABLE_W  = 780;
const TABLE_H  = 440;
const RAIL_W   = 28;           // rail width
const PLAY_X   = RAIL_W;       // play area starts
const PLAY_Y   = RAIL_W;
const PLAY_W   = TABLE_W - RAIL_W * 2;
const PLAY_H   = TABLE_H - RAIL_W * 2;

canvas.width  = TABLE_W;
canvas.height = TABLE_H;

// ── Physics Constants ─────────────────────────────────────────
const BALL_R    = 12;
const FRICTION  = 0.983;
const MAX_PULL  = 100;   // px of cue pull-back for max power
const MAX_VEL   = 16;
const POCKET_R  = 18;
const CUE_GAP   = BALL_R + 8;  // gap between cue tip and ball at rest
const SUBSTEPS  = 3;

// 6 pocket positions
const POCKETS = [
  { x: PLAY_X + 2,          y: PLAY_Y + 2 },          // TL
  { x: PLAY_X + PLAY_W / 2, y: PLAY_Y - 2 },          // TM
  { x: PLAY_X + PLAY_W - 2, y: PLAY_Y + 2 },          // TR
  { x: PLAY_X + 2,          y: PLAY_Y + PLAY_H - 2 }, // BL
  { x: PLAY_X + PLAY_W / 2, y: PLAY_Y + PLAY_H + 2 }, // BM
  { x: PLAY_X + PLAY_W - 2, y: PLAY_Y + PLAY_H - 2 }, // BR
];

// ── State ─────────────────────────────────────────────────────
let currentLesson = 0;
let currentStep   = 0;
let balls         = [];
let cueBall       = null;

// Interaction
let aimAngle      = Math.PI;  // radians: angle from cue ball TO shot target
let isPulling     = false;
let pullOriginX   = 0;
let pullOriginY   = 0;
let pullDist      = 0;       // 0..MAX_PULL
let shooting      = false;   // balls in motion
let readTarget    = null;  // lesson 3: clicked ball

// Ghost drill
let ghostBallPos  = null;
let ghostDrillTarget = null;

// Two paths (lesson 2)
let smartPathChosen = false;

// Feedback
let feedbackTimer = null;

// Animation
let rafId = null;

// ── Ball colors per lesson ────────────────────────────────────
function makeBall(x, y, color, number, isGhost) {
  return {
    x, y, vx: 0, vy: 0,
    color, number,
    radius: BALL_R,
    sunk: false,
    isGhost: isGhost || false,
    threat: null,  // lesson 3
  };
}

// ── Lesson Initializers ───────────────────────────────────────
function initLesson(index) {
  currentLesson  = index;
  currentStep    = 0;
  isPulling      = false;
  pullDist       = 0;
  aimAngle       = Math.PI;
  shooting       = false;
  contactPairs.clear();
  readTarget     = null;
  ghostBallPos   = null;
  ghostDrillTarget = null;
  smartPathChosen  = false;
  setPower(0);

  const cx = PLAY_X, cy = PLAY_Y, cw = PLAY_W, ch = PLAY_H;

  if (index === 0) {
    // Golden Zone — cue ball near rail (Dead Zone)
    cueBall = makeBall(cx + 60, cy + ch / 2, '#FFFFFF', null);
    balls = [
      cueBall,
      makeBall(cx + cw * 0.45, cy + ch * 0.38, '#C9A84C', 1),  // gold
      makeBall(cx + cw * 0.62, cy + ch * 0.60, '#C0392B', 2),  // red
      makeBall(cx + cw * 0.55, cy + ch * 0.25, '#2980B9', 3),  // blue
    ];
  }

  if (index === 1) {
    // Dead Zone — two paths scenario
    cueBall = makeBall(cx + cw * 0.25, cy + ch * 0.75, '#FFFFFF', null);
    balls = [
      cueBall,
      makeBall(cx + cw * 0.42, cy + ch * 0.72, '#C9A84C', 1),  // easy target
      makeBall(cx + cw * 0.50, cy + ch * 0.45, '#C0392B', 2),
      makeBall(cx + cw * 0.65, cy + ch * 0.60, '#2980B9', 3),
    ];
  }

  if (index === 2) {
    // Reading the table — cluster left, open right
    cueBall = makeBall(cx + cw * 0.72, cy + ch * 0.50, '#FFFFFF', null);
    balls = [
      cueBall,
      makeBall(cx + cw * 0.18, cy + ch * 0.30, '#C9A84C', 1, false),
      makeBall(cx + cw * 0.22, cy + ch * 0.50, '#C0392B', 2, false),
      makeBall(cx + cw * 0.18, cy + ch * 0.68, '#2980B9', 3, false),
      makeBall(cx + cw * 0.30, cy + ch * 0.40, '#27AE60', 4, false),
      makeBall(cx + cw * 0.28, cy + ch * 0.62, '#8E44AD', 5, false),
      makeBall(cx + cw * 0.38, cy + ch * 0.52, '#E67E22', 6, false),
    ];
    // Assign threats
    const threats = [
      { label: 'Blocked', order: 5, color: '#C0392B' },
      { label: 'Tight cluster', order: 4, color: '#E67E22' },
      { label: 'Near rail', order: 3, color: '#E67E22' },
      { label: 'Open shot', order: 1, color: '#27AE60' },
      { label: 'Rail access', order: 2, color: '#C9A84C' },
      { label: 'Break shot', order: 6, color: '#C0392B' },
    ];
    for (let i = 1; i < balls.length; i++) {
      balls[i].threat = threats[i - 1];
    }
  }

  if (index === 3) {
    // Ghost Drill — cue ball, one target, one pocket lit
    cueBall = makeBall(cx + cw * 0.35, cy + ch * 0.55, '#FFFFFF', null);
    balls = [
      cueBall,
      makeBall(cx + cw * 0.55, cy + ch * 0.40, '#C9A84C', 1),
    ];
    ghostDrillTarget = balls[1];
  }

  updateUI();
  render();
}

// ── UI Updates ────────────────────────────────────────────────
function updateUI() {
  const L = LESSONS[currentLesson];
  document.getElementById('lesson-number').textContent = L.number;
  document.getElementById('lesson-name').textContent   = L.name;
  document.getElementById('lesson-desc').textContent   = L.desc;
  document.getElementById('step-counter').textContent  = `Step ${currentStep + 1} of ${L.steps.length}`;
  document.getElementById('step-text').textContent     = L.steps[currentStep];
  document.getElementById('topbar-title').textContent  = L.name;

  // Tab highlight
  document.querySelectorAll('.lesson-tab').forEach((t, i) => {
    t.classList.toggle('active', i === currentLesson);
  });

  // Next step button
  const btnNext = document.getElementById('btn-next');
  btnNext.disabled = currentStep >= L.steps.length - 1;
}

function setPower(pct) {
  document.getElementById('power-fill').style.width = pct + '%';
  document.getElementById('power-pct').textContent  = Math.round(pct) + '%';
}

// ── Feedback Overlay ──────────────────────────────────────────
function showFeedback(msg) {
  const el = document.getElementById('feedback-msg');
  el.textContent = msg;
  el.classList.add('show');
  if (feedbackTimer) clearTimeout(feedbackTimer);
  feedbackTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function evalCueBallPosition() {
  if (!cueBall || cueBall.sunk) return;
  const cx = PLAY_X, cy = PLAY_Y, cw = PLAY_W, ch = PLAY_H;

  // Golden Zone: center 40% of table
  const gzX1 = cx + cw * 0.30, gzX2 = cx + cw * 0.70;
  const gzY1 = cy + ch * 0.25, gzY2 = cy + ch * 0.75;
  const deadMargin = 40; // px from rail = Dead Zone

  const inGolden = cueBall.x > gzX1 && cueBall.x < gzX2 && cueBall.y > gzY1 && cueBall.y < gzY2;
  const inDead   = (cueBall.x < cx + deadMargin || cueBall.x > cx + cw - deadMargin ||
                    cueBall.y < cy + deadMargin || cueBall.y > cy + ch - deadMargin);

  if (inGolden)      showFeedback('Golden Zone. Three or more easy shots from here.');
  else if (inDead)   showFeedback('Dead Zone. Banks, kicks, hard cuts — no easy shots. Avoid this.');
  else               showFeedback('Neutral. Work toward the Golden Zone. You want three easy shots waiting.');
}

// ── Physics ───────────────────────────────────────────────────
function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function separateOverlap(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d  = Math.sqrt(dx * dx + dy * dy);
  if (d === 0 || d >= a.radius + b.radius) return;
  const nx = dx / d, ny = dy / d;
  const push = (a.radius + b.radius - d) * 0.5;
  a.x -= nx * push;  a.y -= ny * push;
  b.x += nx * push;  b.y += ny * push;
}

function exchangeVelocity(a, b) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const d  = Math.sqrt(dx * dx + dy * dy);
  if (d === 0) return;
  const nx = dx / d, ny = dy / d;
  const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
  const dot = dvx * nx + dvy * ny;
  if (dot >= 0) return; // already separating
  // Equal-mass elastic: full momentum transfer along the normal
  a.vx -= dot * nx;  a.vy -= dot * ny;
  b.vx += dot * nx;  b.vy += dot * ny;
}

// Track which pairs are currently in contact so velocity exchange fires exactly once
const contactPairs = new Set();

function substep() {
  const cx = PLAY_X, cy = PLAY_Y, cw = PLAY_W, ch = PLAY_H;
  const dt = 1 / SUBSTEPS;

  for (const ball of balls) {
    if (ball.sunk) continue;

    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;

    // Speed-based friction — consistent regardless of substep count
    const spd = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (spd > 0) {
      const ratio = Math.pow(FRICTION, dt);
      ball.vx *= ratio;
      ball.vy *= ratio;
    }

    // Hard stop — eliminates long slow creep
    if (Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) < 0.18) {
      ball.vx = 0;  ball.vy = 0;
    }

    // Rail bounces
    if (ball.x - ball.radius < cx) { ball.x = cx + ball.radius; ball.vx =  Math.abs(ball.vx) * 0.78; }
    if (ball.x + ball.radius > cx + cw) { ball.x = cx + cw - ball.radius; ball.vx = -Math.abs(ball.vx) * 0.78; }
    if (ball.y - ball.radius < cy) { ball.y = cy + ball.radius; ball.vy =  Math.abs(ball.vy) * 0.78; }
    if (ball.y + ball.radius > cy + ch) { ball.y = cy + ch - ball.radius; ball.vy = -Math.abs(ball.vy) * 0.78; }

    // Pocket detection
    for (const p of POCKETS) {
      if (dist(ball, p) < POCKET_R) {
        ball.sunk = true;  ball.vx = 0;  ball.vy = 0;
        break;
      }
    }
  }

  // Ball-ball: position correction every substep, velocity only on first contact
  for (let i = 0; i < balls.length; i++) {
    for (let j = i + 1; j < balls.length; j++) {
      if (balls[i].sunk || balls[j].sunk) continue;
      const key = `${i}:${j}`;
      const touching = dist(balls[i], balls[j]) < balls[i].radius + balls[j].radius;
      if (touching) {
        separateOverlap(balls[i], balls[j]);
        if (!contactPairs.has(key)) {
          exchangeVelocity(balls[i], balls[j]);
          contactPairs.add(key);
        }
      } else {
        contactPairs.delete(key); // reset when balls fully separate
      }
    }
  }
}

function step() {
  for (let s = 0; s < SUBSTEPS; s++) substep();

  let anyMoving = false;
  for (const ball of balls) {
    if (!ball.sunk && (ball.vx !== 0 || ball.vy !== 0)) anyMoving = true;
  }
  return anyMoving;
}

// ── Rendering ─────────────────────────────────────────────────
function drawTable() {
  const W = TABLE_W, H = TABLE_H;

  // Rail background
  ctx.fillStyle = '#142a1e';
  ctx.fillRect(0, 0, W, H);

  // Rail border
  ctx.fillStyle = '#1B4332';
  ctx.fillRect(0, 0, W, H);

  // Rail highlight (inner edge)
  ctx.strokeStyle = '#2D6A4F';
  ctx.lineWidth = 2;
  ctx.strokeRect(RAIL_W - 2, RAIL_W - 2, PLAY_W + 4, PLAY_H + 4);

  // Felt
  ctx.fillStyle = '#0D2B1F';
  ctx.fillRect(PLAY_X, PLAY_Y, PLAY_W, PLAY_H);

  // Subtle felt texture (light radial gradient)
  const feltGrad = ctx.createRadialGradient(
    PLAY_X + PLAY_W / 2, PLAY_Y + PLAY_H / 2, 20,
    PLAY_X + PLAY_W / 2, PLAY_Y + PLAY_H / 2, Math.max(PLAY_W, PLAY_H) * 0.7
  );
  feltGrad.addColorStop(0, 'rgba(255,255,255,0.025)');
  feltGrad.addColorStop(1, 'rgba(0,0,0,0.15)');
  ctx.fillStyle = feltGrad;
  ctx.fillRect(PLAY_X, PLAY_Y, PLAY_W, PLAY_H);

  // Pockets
  for (const p of POCKETS) {
    // Dark pocket hole
    ctx.beginPath();
    ctx.arc(p.x, p.y, POCKET_R, 0, Math.PI * 2);
    ctx.fillStyle = '#050505';
    ctx.fill();

    // Gold rim
    ctx.beginPath();
    ctx.arc(p.x, p.y, POCKET_R + 1, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(201,168,76,0.5)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  // Rail dot markers (decorative)
  const dotColor = 'rgba(201,168,76,0.6)';
  const dotR = 4;
  const railDots = [
    { x: PLAY_X + PLAY_W * 0.25, y: RAIL_W / 2 },
    { x: PLAY_X + PLAY_W * 0.75, y: RAIL_W / 2 },
    { x: PLAY_X + PLAY_W * 0.25, y: TABLE_H - RAIL_W / 2 },
    { x: PLAY_X + PLAY_W * 0.75, y: TABLE_H - RAIL_W / 2 },
    { x: RAIL_W / 2, y: PLAY_Y + PLAY_H * 0.33 },
    { x: RAIL_W / 2, y: PLAY_Y + PLAY_H * 0.67 },
    { x: TABLE_W - RAIL_W / 2, y: PLAY_Y + PLAY_H * 0.33 },
    { x: TABLE_W - RAIL_W / 2, y: PLAY_Y + PLAY_H * 0.67 },
  ];
  for (const d of railDots) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, dotR, 0, Math.PI * 2);
    ctx.fillStyle = dotColor;
    ctx.fill();
  }
}

function drawZones() {
  const L = LESSONS[currentLesson];
  const cx = PLAY_X, cy = PLAY_Y, cw = PLAY_W, ch = PLAY_H;

  if (L.showDeadZone) {
    // Dead Zone — 4 rectangles near rails
    ctx.setLineDash([5, 5]);
    ctx.lineWidth = 1.5;
    const dz = 40;
    const dzRegions = [
      [cx, cy, cw, dz],              // top
      [cx, cy + ch - dz, cw, dz],    // bottom
      [cx, cy + dz, dz, ch - dz * 2], // left
      [cx + cw - dz, cy + dz, dz, ch - dz * 2], // right
    ];
    for (const [rx, ry, rw, rh] of dzRegions) {
      ctx.fillStyle = 'rgba(180,40,40,0.08)';
      ctx.fillRect(rx, ry, rw, rh);
      ctx.strokeStyle = 'rgba(180,40,40,0.3)';
      ctx.strokeRect(rx, ry, rw, rh);
    }

    // Label
    ctx.setLineDash([]);
    ctx.font = '10px Inter, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(220,80,80,0.6)';
    ctx.textAlign = 'center';
    ctx.fillText('DEAD ZONE', cx + cw / 2, cy + 14);
    ctx.fillText('DEAD ZONE', cx + cw / 2, cy + ch - 6);
  }

  if (L.showGoldenZone) {
    const gx = cx + cw * 0.30, gy = cy + ch * 0.25;
    const gw = cw * 0.40, gh = ch * 0.50;
    const ex = gx + gw / 2, ey = gy + gh / 2;
    const rx = gw / 2, ry = gh / 2;

    ctx.save();
    ctx.translate(ex, ey);
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(201,168,76,0.10)';
    ctx.fill();
    ctx.setLineDash([6, 4]);
    ctx.strokeStyle = 'rgba(201,168,76,0.4)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.restore();
    ctx.setLineDash([]);

    ctx.font = '10px Inter, system-ui, sans-serif';
    ctx.fillStyle = 'rgba(201,168,76,0.7)';
    ctx.textAlign = 'center';
    ctx.fillText('GOLDEN ZONE', ex, ey);
  }
}

function drawTwoPaths() {
  if (currentLesson !== 1) return;
  const cb = cueBall;
  if (!cb || cb.sunk) return;
  // Find target ball (index 1)
  const target = balls.find((b, i) => i === 1 && !b.sunk);
  if (!target) return;

  const cx = PLAY_X, cy = PLAY_Y, cw = PLAY_W, ch = PLAY_H;

  // Red (bad) path — shoot directly, continue toward bottom rail
  const dx1 = target.x - cb.x, dy1 = target.y - cb.y;
  const len1 = Math.sqrt(dx1 * dx1 + dy1 * dy1);
  const nx1 = dx1 / len1, ny1 = dy1 / len1;

  ctx.setLineDash([6, 5]);
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(200,60,60,0.65)';
  ctx.beginPath();
  ctx.moveTo(cb.x, cb.y);
  ctx.lineTo(cb.x + nx1 * 160, cb.y + ny1 * 160);
  ctx.stroke();

  // Red path label
  ctx.setLineDash([]);
  ctx.font = '11px Inter, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(200,60,60,0.85)';
  ctx.textAlign = 'left';
  ctx.fillText('Obvious shot', cb.x + nx1 * 80 + 8, cb.y + ny1 * 80 - 4);

  // Gold (smart) path — angled shot toward Golden Zone center
  const goldAngle = Math.atan2(-(cy + ch * 0.5 - cb.y), (cx + cw * 0.55 - cb.x));
  const nx2 = Math.cos(goldAngle), ny2 = Math.sin(goldAngle);

  ctx.setLineDash([6, 5]);
  ctx.strokeStyle = 'rgba(201,168,76,0.70)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cb.x, cb.y);
  ctx.lineTo(cb.x + nx2 * 160, cb.y + ny2 * 160);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.fillStyle = 'rgba(201,168,76,0.9)';
  ctx.textAlign = 'right';
  ctx.fillText('Smart shot ▶', cb.x + nx2 * 90 - 8, cb.y + ny2 * 90 - 6);

  // Click target for smart path
  if (!smartPathChosen) {
    ctx.beginPath();
    ctx.arc(cb.x + nx2 * 120, cb.y + ny2 * 120, 10, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(201,168,76,0.25)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(201,168,76,0.8)';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawGhostDrill() {
  if (currentLesson !== 3) return;
  if (!ghostBallPos) return;

  // Ghost ball circle
  ctx.beginPath();
  ctx.arc(ghostBallPos.x, ghostBallPos.y, BALL_R, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.18)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.lineWidth = 1.5;
  ctx.setLineDash([4, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Line from ghost ball center to target ball center
  const t = ghostDrillTarget;
  ctx.beginPath();
  ctx.moveTo(ghostBallPos.x, ghostBallPos.y);
  ctx.lineTo(t.x, t.y);
  ctx.strokeStyle = 'rgba(201,168,76,0.5)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 4]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Label
  ctx.font = '11px Inter, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.textAlign = 'center';
  ctx.fillText('Ghost Ball', ghostBallPos.x, ghostBallPos.y - BALL_R - 6);
}

function drawBall(ball) {
  if (ball.sunk) return;

  ctx.save();
  ctx.translate(ball.x, ball.y);

  // Ball shadow
  const shadowGrad = ctx.createRadialGradient(2, 3, 0, 0, 0, ball.radius + 3);
  shadowGrad.addColorStop(0, 'rgba(0,0,0,0.4)');
  shadowGrad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.beginPath();
  ctx.arc(2, 3, ball.radius + 2, 0, Math.PI * 2);
  ctx.fillStyle = shadowGrad;
  ctx.fill();

  // Ball body
  const grad = ctx.createRadialGradient(-4, -4, 2, 0, 0, ball.radius);
  grad.addColorStop(0, lighten(ball.color, 0.4));
  grad.addColorStop(0.6, ball.color);
  grad.addColorStop(1, darken(ball.color, 0.35));
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  // Highlight
  const hiGrad = ctx.createRadialGradient(-4, -5, 0, -4, -5, ball.radius * 0.7);
  hiGrad.addColorStop(0, 'rgba(255,255,255,0.45)');
  hiGrad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.beginPath();
  ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = hiGrad;
  ctx.fill();

  // Number/dot
  if (ball.number !== null && ball.color !== '#FFFFFF') {
    // White number circle
    ctx.beginPath();
    ctx.arc(0, 0, ball.radius * 0.52, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.fill();
    ctx.font = `bold ${ball.radius * 0.70}px Inter, system-ui, sans-serif`;
    ctx.fillStyle = '#222';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(ball.number), 0, 0.5);
    ctx.textBaseline = 'alphabetic';
  } else if (ball.color === '#FFFFFF') {
    // Cue ball dot
    ctx.beginPath();
    ctx.arc(0, 0, 3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(100,100,100,0.4)';
    ctx.fill();
  }

  ctx.restore();
}

function drawReadModeOverlay(ball) {
  if (ball.sunk || !ball.threat || currentLesson !== 2) return;
  if (readTarget !== ball) return;

  ctx.save();
  // Panel above ball
  const pw = 120, ph = 52;
  const px = ball.x - pw / 2;
  const py = ball.y - BALL_R - ph - 10;

  ctx.fillStyle = 'rgba(8,8,8,0.9)';
  ctx.strokeStyle = 'rgba(201,168,76,0.5)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  // Rounded rect (manual for browser compat)
  const r3 = 3;
  ctx.moveTo(px + r3, py);
  ctx.lineTo(px + pw - r3, py);
  ctx.arcTo(px + pw, py, px + pw, py + r3, r3);
  ctx.lineTo(px + pw, py + ph - r3);
  ctx.arcTo(px + pw, py + ph, px + pw - r3, py + ph, r3);
  ctx.lineTo(px + r3, py + ph);
  ctx.arcTo(px, py + ph, px, py + ph - r3, r3);
  ctx.lineTo(px, py + r3);
  ctx.arcTo(px, py, px + r3, py, r3);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Order
  ctx.font = '10px Inter, system-ui, sans-serif';
  ctx.fillStyle = 'rgba(201,168,76,0.9)';
  ctx.textAlign = 'center';
  ctx.fillText(`Run order: #${ball.threat.order}`, ball.x, py + 16);

  // Threat
  ctx.fillStyle = ball.threat.color;
  ctx.fillText(ball.threat.label, ball.x, py + 33);

  // Arrow from panel to ball
  ctx.beginPath();
  ctx.moveTo(ball.x, py + ph);
  ctx.lineTo(ball.x, ball.y - BALL_R);
  ctx.strokeStyle = 'rgba(201,168,76,0.35)';
  ctx.lineWidth = 1;
  ctx.setLineDash([3, 3]);
  ctx.stroke();
  ctx.setLineDash([]);

  ctx.restore();
}

function drawAimLine() {
  if (shooting || !cueBall || cueBall.sunk) return;

  const cb  = cueBall;
  const cosA = Math.cos(aimAngle);
  const sinA = Math.sin(aimAngle);

  // Cue stick — pulls back by pullDist when user is dragging
  const tipDist = CUE_GAP + pullDist;
  const tipX  = cb.x - cosA * tipDist;
  const tipY  = cb.y - sinA * tipDist;
  const buttX = tipX - cosA * 140;
  const buttY = tipY - sinA * 140;

  const stickGrad = ctx.createLinearGradient(tipX, tipY, buttX, buttY);
  stickGrad.addColorStop(0,    'rgba(220,185,110,0.95)');
  stickGrad.addColorStop(0.25, 'rgba(175,135,70,0.88)');
  stickGrad.addColorStop(1,    'rgba(100,70,35,0.18)');

  ctx.beginPath();
  ctx.moveTo(tipX, tipY);
  ctx.lineTo(buttX, buttY);
  ctx.strokeStyle = stickGrad;
  ctx.lineWidth = isPulling ? 5 : 4;
  ctx.lineCap = 'round';
  ctx.setLineDash([]);
  ctx.stroke();
  ctx.lineCap = 'butt';

  // Cue tip chalk dot
  ctx.beginPath();
  ctx.arc(tipX, tipY, 2.5, 0, Math.PI * 2);
  ctx.fillStyle = '#7acfff';
  ctx.fill();

  // Aim guide line (forward, gold dotted) — brighter when pulled
  const alpha = isPulling ? 0.25 + (pullDist / MAX_PULL) * 0.5 : 0.3;
  ctx.beginPath();
  ctx.moveTo(cb.x + cosA * (BALL_R + 2), cb.y + sinA * (BALL_R + 2));
  ctx.lineTo(cb.x + cosA * 240, cb.y + sinA * 240);
  ctx.strokeStyle = `rgba(201,168,76,${alpha})`;
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 6]);
  ctx.stroke();
  ctx.setLineDash([]);

  // Ghost ball contact for lessons that use it
  const L = LESSONS[currentLesson];
  if (L.showGhost && currentLesson !== 3) {
    const ghost = findGhostContact(cb, cosA, sinA);
    if (ghost) {
      ctx.beginPath();
      ctx.arc(ghost.gx, ghost.gy, BALL_R, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.42)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([3, 3]);
      ctx.stroke();
      ctx.setLineDash([]);

      // Post-contact cue ball deflection path
      const postDx = ghost.gx - ghost.target.x;
      const postDy = ghost.gy - ghost.target.y;
      const postD  = Math.sqrt(postDx * postDx + postDy * postDy);
      if (postD > 0) {
        const pnx = postDx / postD, pny = postDy / postD;
        const postEnd = { x: ghost.gx + pnx * 110, y: ghost.gy + pny * 110 };
        ctx.beginPath();
        ctx.moveTo(ghost.gx, ghost.gy);
        ctx.lineTo(postEnd.x, postEnd.y);
        ctx.strokeStyle = 'rgba(201,168,76,0.32)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }
  }
}

function findGhostContact(cb, nx, ny) {
  let closest = null;
  let closestT = Infinity;
  for (const b of balls) {
    if (b === cb || b.sunk) continue;
    // Ray-circle intersection: find where ray from cb in dir (nx,ny) hits circle of radius 2*BALL_R around b
    const ex = cb.x - b.x, ey = cb.y - b.y;
    const a = 1; // nx^2+ny^2=1
    const bv = 2 * (ex * nx + ey * ny);
    const c = ex * ex + ey * ey - (BALL_R * 2) * (BALL_R * 2);
    const disc = bv * bv - 4 * a * c;
    if (disc < 0) continue;
    const t = (-bv - Math.sqrt(disc)) / 2;
    if (t > 0 && t < closestT) {
      closestT = t;
      closest = { gx: cb.x + nx * t, gy: cb.y + ny * t, target: b };
    }
  }
  return closest;
}

function render() {
  ctx.clearRect(0, 0, TABLE_W, TABLE_H);
  drawTable();
  drawZones();
  if (currentLesson === 1 && !shooting) drawTwoPaths();
  drawAimLine();
  drawGhostDrill();
  for (const ball of balls) {
    drawBall(ball);
    if (currentLesson === 2) drawReadModeOverlay(ball);
  }
}

// ── Animation Loop ────────────────────────────────────────────
function animate() {
  const moving = step();
  render();
  if (moving) {
    rafId = requestAnimationFrame(animate);
  } else {
    shooting = false;
    rafId = null;
    // Post-shot evaluation
    const L = LESSONS[currentLesson];
    if (L.showGoldenZone || L.showDeadZone) {
      evalCueBallPosition();
    }
    // Auto-advance step if not at last
    if (currentStep < L.steps.length - 1) {
      currentStep++;
      updateUI();
    }
  }
}

// ── Interaction ───────────────────────────────────────────────
function canvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = TABLE_W / rect.width;
  const scaleY = TABLE_H / rect.height;
  const src = e.touches ? e.touches[0] : e;
  return {
    x: (src.clientX - rect.left) * scaleX,
    y: (src.clientY - rect.top)  * scaleY,
  };
}

function ballAt(pos) {
  for (const ball of balls) {
    if (ball.sunk) continue;
    const dx = pos.x - ball.x, dy = pos.y - ball.y;
    if (dx * dx + dy * dy < (ball.radius + 6) * (ball.radius + 6)) return ball;
  }
  return null;
}

function smartPathHit(pos) {
  if (currentLesson !== 1) return false;
  const cb = cueBall;
  if (!cb || cb.sunk) return false;
  const goldAngle = Math.atan2(-(PLAY_Y + PLAY_H * 0.5 - cb.y), (PLAY_X + PLAY_W * 0.55 - cb.x));
  const nx = Math.cos(goldAngle), ny = Math.sin(goldAngle);
  const hx = cb.x + nx * 120, hy = cb.y + ny * 120;
  const dx = pos.x - hx, dy = pos.y - hy;
  return dx * dx + dy * dy < 20 * 20;
}

canvas.addEventListener('mousedown', onDown);
canvas.addEventListener('mousemove', onMove);
canvas.addEventListener('mouseup',   onUp);
canvas.addEventListener('mouseleave', onUp);
canvas.addEventListener('touchstart', onDown, { passive: false });
canvas.addEventListener('touchmove',  onMove, { passive: false });
canvas.addEventListener('touchend',   onUp,   { passive: false });

// Always track mouse to orbit the cue around the cue ball
canvas.addEventListener('mousemove', (e) => {
  if (shooting || isPulling || !cueBall || cueBall.sunk) return;
  const pos = canvasPos(e);
  const dx = pos.x - cueBall.x, dy = pos.y - cueBall.y;
  if (dx * dx + dy * dy > 4) {
    aimAngle = Math.atan2(dy, dx);
    render();
  }
}, { passive: true });

function onDown(e) {
  e.preventDefault();
  if (shooting) return;
  const pos = canvasPos(e);

  // Lesson 3 — read mode click
  if (currentLesson === 2) {
    const hit = ballAt(pos);
    if (hit && hit !== cueBall) {
      readTarget = (readTarget === hit) ? null : hit;
      render();
      if (readTarget && currentStep < LESSONS[2].steps.length - 1) {
        currentStep = Math.min(currentStep + 1, LESSONS[2].steps.length - 1);
        updateUI();
      }
      return;
    }
  }

  // Lesson 2 — smart path click
  if (currentLesson === 1 && smartPathHit(pos) && !smartPathChosen) {
    smartPathChosen = true;
    const cb = cueBall;
    const goldAngle = Math.atan2(-(PLAY_Y + PLAY_H * 0.5 - cb.y), (PLAY_X + PLAY_W * 0.55 - cb.x));
    const speed = 0.65 * MAX_VEL;
    cb.vx = Math.cos(goldAngle) * speed;
    cb.vy = Math.sin(goldAngle) * speed;
    shooting = true;
    setPower(0);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(animate);
    return;
  }

  // Lesson 4 — ghost drill: click target ball to reveal ghost
  if (currentLesson === 3) {
    const hit = ballAt(pos);
    if (hit && hit === ghostDrillTarget) {
      // Calculate ghost ball position (where cue ball must be to pocket the target)
      const pocket = POCKETS[2]; // TR pocket
      const dxp = pocket.x - hit.x, dyp = pocket.y - hit.y;
      const dp  = Math.sqrt(dxp * dxp + dyp * dyp);
      const nxp = dxp / dp, nyp = dyp / dp;
      ghostBallPos = {
        x: hit.x - nxp * BALL_R * 2,
        y: hit.y - nyp * BALL_R * 2,
      };
      if (currentStep < LESSONS[3].steps.length - 1) {
        currentStep++;
        updateUI();
      }
      render();
      return;
    }
    // After ghost revealed, pulling starts normally below
  }

  // Start pull — click anywhere on canvas begins a pull-back
  if (!cueBall || cueBall.sunk) return;
  isPulling = true;
  pullOriginX = pos.x;
  pullOriginY = pos.y;
  pullDist = 0;
  setPower(0);
}

function onMove(e) {
  e.preventDefault();
  if (shooting || !isPulling) return;
  const pos = canvasPos(e);

  // Pull distance = how far user has moved in the direction OPPOSITE to aimAngle
  const backX = -Math.cos(aimAngle);
  const backY = -Math.sin(aimAngle);
  const dragX = pos.x - pullOriginX;
  const dragY = pos.y - pullOriginY;
  const raw = dragX * backX + dragY * backY;  // dot product: positive = pulling back
  pullDist = Math.max(0, Math.min(raw, MAX_PULL));
  setPower((pullDist / MAX_PULL) * 100);
  render();
}

function onUp(e) {
  e.preventDefault();
  if (!isPulling) return;
  isPulling = false;

  if (pullDist < 5 || !cueBall || cueBall.sunk) {
    pullDist = 0;
    setPower(0);
    render();
    return;
  }

  const power = pullDist / MAX_PULL;
  cueBall.vx = Math.cos(aimAngle) * power * MAX_VEL;
  cueBall.vy = Math.sin(aimAngle) * power * MAX_VEL;

  pullDist = 0;
  setPower(0);
  shooting = true;

  if (rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(animate);
}

// ── Button Handlers ───────────────────────────────────────────
document.getElementById('btn-next').addEventListener('click', () => {
  const L = LESSONS[currentLesson];
  if (currentStep < L.steps.length - 1) {
    currentStep++;
    updateUI();
  }
});

document.getElementById('btn-reset').addEventListener('click', () => {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  initLesson(currentLesson);
});

document.querySelectorAll('.lesson-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const idx = parseInt(tab.dataset.lesson, 10);
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
    initLesson(idx);
  });
});

// ── Color Helpers ─────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return [r, g, b];
}
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lighten(hex, amt) {
  try {
    const [r, g, b] = hexToRgb(hex);
    return `rgb(${clamp(r + 255 * amt, 0, 255)|0},${clamp(g + 255 * amt, 0, 255)|0},${clamp(b + 255 * amt, 0, 255)|0})`;
  } catch { return hex; }
}
function darken(hex, amt) {
  try {
    const [r, g, b] = hexToRgb(hex);
    return `rgb(${clamp(r * (1 - amt), 0, 255)|0},${clamp(g * (1 - amt), 0, 255)|0},${clamp(b * (1 - amt), 0, 255)|0})`;
  } catch { return hex; }
}

// ── Canvas Sizing ─────────────────────────────────────────────
function resizeCanvas() {
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth  - 48;
  const ah = area.clientHeight - 48;
  const scale = Math.min(aw / TABLE_W, ah / TABLE_H, 1.0);
  canvas.style.width  = Math.floor(TABLE_W * scale) + 'px';
  canvas.style.height = Math.floor(TABLE_H * scale) + 'px';
}

window.addEventListener('resize', () => { resizeCanvas(); render(); });

// ── Boot ──────────────────────────────────────────────────────
resizeCanvas();
initLesson(0);

})();
</script>
