<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <radialGradient id="rimLight" cx="75%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floorGlow" cx="50%" cy="100%" r="40%">
      <stop offset="0%" stop-color="#0D2B1F" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="figureGrad" x1="20%" y1="0%" x2="80%" y2="0%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="60%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#1e1a14"/>
    </linearGradient>
    <linearGradient id="cueGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#8a6820" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2a1a05" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="800" fill="#050606"/>

  <!-- Rim light atmosphere from right -->
  <rect width="600" height="800" fill="url(#rimLight)"/>

  <!-- Floor glow (pool table nearby, off frame) -->
  <rect width="600" height="800" fill="url(#floorGlow)"/>

  <!-- Floor line suggestion -->
  <rect x="0" y="730" width="600" height="70" fill="#050606" opacity="0.8"/>
  <line x1="0" y1="730" x2="600" y2="730" stroke="#0D2B1F" stroke-width="1" opacity="0.4"/>

  <!-- Shadow on floor -->
  <ellipse cx="300" cy="754" rx="80" ry="18" fill="#000" opacity="0.7"/>

  <!-- Legs — feet slightly apart, composed stance -->
  <!-- Left leg -->
  <path d="M 255 620 Q 248 680 244 730" stroke="url(#figureGrad)" stroke-width="44" fill="none" stroke-linecap="round"/>
  <!-- Right leg -->
  <path d="M 340 620 Q 346 680 352 730" stroke="url(#figureGrad)" stroke-width="44" fill="none" stroke-linecap="round"/>

  <!-- Shoes -->
  <ellipse cx="242" cy="730" rx="30" ry="12" fill="#0d0d0d"/>
  <ellipse cx="354" cy="730" rx="30" ry="12" fill="#0d0d0d"/>

  <!-- Body torso — tall, still -->
  <path d="M 230 340 Q 222 450 235 560 L 248 620 L 352 620 L 365 560 Q 378 450 370 340 Q 345 318 300 316 Q 255 318 230 340 Z" fill="url(#figureGrad)"/>

  <!-- Rim light on right shoulder/side -->
  <path d="M 365 340 Q 378 420 370 560 L 360 610" stroke="#C9A84C" stroke-width="2" fill="none" opacity="0.15"/>

  <!-- Left arm — hanging naturally at side -->
  <path d="M 232 370 Q 210 430 205 510 Q 202 540 208 560" stroke="#0d0d0d" stroke-width="30" fill="none" stroke-linecap="round"/>
  <ellipse cx="210" cy="568" rx="16" ry="12" fill="#0d0d0d"/>

  <!-- Right arm — holding cue -->
  <path d="M 366 370 Q 372 420 368 490 Q 365 530 360 560" stroke="#0d0d0d" stroke-width="28" fill="none" stroke-linecap="round"/>
  <!-- Right hand holding cue -->
  <ellipse cx="358" cy="568" rx="16" ry="12" fill="#0d0d0d"/>

  <!-- Pool cue — held vertically like a staff -->
  <line x1="360" y1="80" x2="360" y2="738" stroke="url(#cueGrad4)" stroke-width="6" stroke-linecap="round"/>
  <!-- Cue tip (top) -->
  <circle cx="360" cy="82" r="4" fill="#7acfff" opacity="0.6"/>
  <!-- Cue butt (floor) -->
  <ellipse cx="360" cy="736" rx="7" ry="4" fill="#3a2510" opacity="0.8"/>

  <!-- Neck -->
  <rect x="282" y="305" width="36" height="40" rx="10" fill="#0e0e0e"/>

  <!-- Head — facing slightly away, in shadow -->
  <ellipse cx="300" cy="280" rx="42" ry="46" fill="#0e0e0e"/>
  <!-- Face in shadow — only slight rim light on left profile -->
  <path d="M 258 265 Q 255 278 260 295 Q 268 310 280 315" stroke="#1a1a14" stroke-width="3" fill="none" opacity="0.4"/>

  <!-- Rim light on head right side -->
  <path d="M 336 248 Q 342 262 340 282 Q 338 298 330 310" stroke="#C9A84C" stroke-width="2" fill="none" opacity="0.2"/>

  <!-- Background pool table edge barely visible -->
  <rect x="0" y="580" width="100" height="160" rx="4" fill="#0D2B1F" opacity="0.25"/>
  <rect x="0" y="580" width="100" height="6" fill="#2D6A4F" opacity="0.2"/>

  <!-- Vignette -->
  <radialGradient id="vig4" cx="40%" cy="45%" r="60%">
    <stop offset="30%" stop-color="transparent"/>
    <stop offset="100%" stop-color="#000" stop-opacity="0.82"/>
  </radialGradient>
  <rect width="600" height="800" fill="url(#vig4)"/>
</svg>
